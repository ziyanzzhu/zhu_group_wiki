website:
  title: "Zhu Group Wiki"
  description: "We develop numerical models to predict and understand emergent quantum phenomena by studying the coupling between lattices, electrons, and spins. Our multiscale framework bridges atomistic simulations with the mesoscopic properties of large aperiodic quantum materials. We aim to guide experimental searches for exotic phases of matter, from superconductivity to topological states."
